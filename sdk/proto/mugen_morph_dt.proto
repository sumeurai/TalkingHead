syntax = "proto3";

// Companion schema for POST /v1/mugen-morph/dt success body.
// The gateway wraps MugenMorphDtResponse in DtEnvelope.

message DtEnvelope {
  int32 code = 1;                 // 200 on success
  string msg = 2;                 // Server-provided status message
  MugenMorphDtResponse data = 3;
}

// DT response field numbers are unchanged by the local message rename.
message MugenMorphDtResponse {
  int32 fps = 1;
  int32 num_frames = 2;
  string model_id = 3;
  string ABI = 4;
  string AK = 5;
  string API = 6;
  string ATI = 7;
}
